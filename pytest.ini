[pytest]
# 测试路径
testpaths = tests

# 标记注册 — 区分生产核心 / 研发扩展用例
markers =
    prod:     生产环境用例 — 研发环境的子集, 机台部署前必须通过
    extended: 研发扩展用例 — 仅研发环境运行 (性能/压力/参数扫描/边界探索)

# 研发环境: pytest              (运行全部 = prod + extended)
# 生产环境: pytest -m "prod"     (仅 prod 子集)
# 研发扩展: pytest -m "extended" (仅 extended 子集)
addopts = -v --tb=short -ra

# 日志
log_cli = false
log_cli_level = INFO
