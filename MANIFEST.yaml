# MANIFEST.yaml — 文件级显式排除规则
# 命中任一 exclude_patterns 的文件不入制品, 其余全量保留

build:
  exclude_patterns:
    # 测试文件
    - "**/test_*.py"
    - "**/conftest.py"

    # 构建脚本 (仅开发仓使用)
    - "scripts/**"

    # 开发配置文件
    - "pytest.ini"
    - "MANIFEST.yaml"

    # Python 缓存
    - "**/__pycache__/**"
    - "**/*.pyc"

    # 实验/调试模块 (按需增删)
    # 排除前确认: L1/L2 三级校验会自动检测 ImportError,
    # 若 CI 流水线 L1 或 L2 失败则说明排除规则破坏了依赖链
    # - "**/decomposition.py"
    # - "**/experimental/**"
    # - "**/legacy/**"

    # 合规: 排除含 GPL 代码的文件 (示例)
    # - "**/*_gpl.py"

  # 字符串黑名单 — 裁剪完成后扫描所有保留的 .py 文件
  # 命中任一规则 → 构建中止
  string_blacklist:
    # - "GPL-3.0"
    # - "proprietary_key_xxxx"
    # - "internal.dev.company.com"
