# MANIFEST.yaml — 文件级显式排除规则
# 命中任一 exclude_patterns 的文件不入制品, 其余全量保留

build:
  exclude_patterns:
    # 测试文件
    - "**/test_*.py"
    - "**/conftest.py"

    # 构建脚本 (仅开发仓使用)
    - "scripts/**"

    # 开发配置文件
    - "pytest.ini"
    - "MANIFEST.yaml"

    # Python 缓存
    - "**/__pycache__/**"
    - "**/*.pyc"

    # 实验/调试模块 (按需增删)
    # 注意: 排除前确保该模块不被其他保留文件 import,
    #       否则会导致 ImportError。可用 git grep 检查依赖。
    # - "**/decomposition.py"
    # - "**/experimental/**"
    # - "**/legacy/**"

    # 合规: 排除含 GPL 代码的文件 (示例)
    # - "**/*_gpl.py"
