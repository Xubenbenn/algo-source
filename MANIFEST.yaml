# MANIFEST.yaml — 文件级显式排除规则
# 命中任一 exclude_patterns 的文件不入制品, 其余全量保留

build:
  exclude_patterns:
    # 测试文件
    - "**/test_*.py"
    - "**/conftest.py"

    # 构建脚本 (仅开发仓使用)
    - "scripts/**"

    # 开发配置文件
    - "pytest.ini"
    - "MANIFEST.yaml"

    # Python 缓存
    - "**/__pycache__/**"
    - "**/*.pyc"

    # 矩阵分解模块 — 仅仿真调试用, 不进入机台
    - "**/decomposition.py"

    # 实验/调试模块 (示例: 可按需增删)
    # - "**/experimental/**"
    # - "**/legacy/**"

    # 合规: 排除含 GPL 代码的文件 (示例)
    # - "**/*_gpl.py"
