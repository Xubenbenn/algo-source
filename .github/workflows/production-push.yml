name: 生产推送

on:
  workflow_dispatch:
    inputs:
      commit:
        description: '要发布的 master commit SHA'
        required: true
        type: string
      semver:
        description: '对外版本号 (如 v1.2.0, 写入 VERSION + 产品仓 tag)'
        required: true
        type: string
      tag:
        description: '发布描述 (commit message)'
        required: true
        type: string
        default: '手动发布'
      version_id:
        description: '发布序号元数据 (仅记录到 VERSION, 不影响寻址)'
        required: false
        type: string

jobs:
  # ═══════════════════════════════════════════════════════════
  # Job 1: 裁剪 + 校验 + release 分支线性追加 (唯一裁剪点)
  # ═══════════════════════════════════════════════════════════
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # 推送 release 分支 + tag 到开发仓

    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      content_hash: ${{ steps.release.outputs.content_hash }}

    steps:
      - name: 检出开发仓
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit }}
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 校验 commit 在 master 上
        run: |
          COMMIT="${{ github.event.inputs.commit }}"
          if ! git merge-base --is-ancestor "$COMMIT" origin/master; then
            echo "❌ $(echo $COMMIT | cut -c1-7) 不在 origin/master 上"
            exit 1
          fi
          echo "✅ $(echo $COMMIT | cut -c1-7) 已合入 origin/master"

      - name: 构建裁剪源码
        run: |
          pip install pyyaml
          python scripts/build_machine.py \
            --manifest MANIFEST.yaml \
            --dst /tmp/build_output > /tmp/build_report.txt 2>&1
          cat /tmp/build_report.txt

      - name: L1 包级导入
        run: |
          cd /tmp/build_output
          python3 -B -c "
          import sys; sys.path.insert(0, '.')
          import model
          print('✅ L1 通过')
          "

      - name: L2+L3 测试
        run: |
          pip install -r requirements.txt
          cd /tmp/build_output
          python3 -B -c "
          import sys, importlib, pathlib
          sys.path.insert(0, '.')
          errors = []
          for f in sorted(pathlib.Path('model').rglob('*.py')):
              if f.name == '__init__.py': continue
              mod = str(f.with_suffix('')).replace('/', '.')
              try: importlib.import_module(mod)
              except Exception as e: errors.append((mod, type(e).__name__))
          if errors:
              for m, e in errors: print(f'   ❌ {m} → {e}')
              exit(1)
          print(f'✅ L2 通过: {len(list(pathlib.Path(\"model\").rglob(\"*.py\")))} 个模块')
          "
          cd $GITHUB_WORKSPACE
          python -m pytest tests/ -m "prod" -q --tb=short

      - name: 计算 content_hash (校验基准)
        id: hash
        run: |
          cd /tmp/build_output
          # model/ 树哈希: 排除 BUILD_REPORT 等非确定性文件
          HASH=$(find model -type f -exec sha256sum {} + | sort -k2 | sha256sum | cut -d' ' -f1)
          echo "content_hash=${HASH}" >> $GITHUB_OUTPUT
          echo "content_hash: ${HASH}"

      - name: 生成 release 分支 commit (永远线性追加)
        id: release
        run: |
          set -euo pipefail
          COMMIT="${{ github.event.inputs.commit }}"
          SEMVER="${{ github.event.inputs.semver }}"
          TAG="${{ github.event.inputs.tag }}"
          VERSION_ID="${{ github.event.inputs.version_id }}"
          COMMIT_SHORT=$(echo "$COMMIT" | cut -c1-7)
          RELEASE_DATE=$(date +%Y%m%d%H%M)
          CONTENT_HASH="${{ steps.hash.outputs.content_hash }}"

          # MANIFEST 快照哈希
          MANIFEST_HASH=$(sha256sum MANIFEST.yaml | cut -d' ' -f1)

          # 配置 git 身份
          git config --global user.name "CI Bot"
          git config --global user.email "ci@algo-source.bot"

          # 对齐 release 分支 (首次创建, 后续线性追加)
          git fetch origin release 2>/dev/null || true
          if git rev-parse origin/release >/dev/null 2>&1; then
            git checkout release
            git reset --hard origin/release
          else
            git checkout --orphan release
            git rm -rf --cached . 2>/dev/null || true
            find . -mindepth 1 -not -path './.git' -not -path './.git/*' -delete 2>/dev/null || true
          fi

          # 空树重建: 清空工作树 (机制2)
          git rm -rf --cached . 2>/dev/null || true
          find . -mindepth 1 -not -path './.git' -not -path './.git/*' -delete 2>/dev/null || true

          # release 分支内容: 裁剪产物 + MANIFEST 快照 + 裁剪日志 + VERSION
          cp -r /tmp/build_output/model .
          find model/ -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          cp MANIFEST.yaml MANIFEST.snapshot.yaml
          cp /tmp/build_report.txt BUILD_REPORT.txt
          cat > VERSION << EOF
          semver: ${SEMVER}
          version_id: ${VERSION_ID:-""}
          release_tag: (auto)
          source_commit: ${COMMIT}
          manifest_hash: ${MANIFEST_HASH}
          content_hash: ${CONTENT_HASH}
          release_date: ${RELEASE_DATE}
          tag: ${TAG}
          EOF

          git add model/ MANIFEST.snapshot.yaml BUILD_REPORT.txt VERSION
          git commit -m "release: ${SEMVER} (source=${COMMIT_SHORT}, manifest=${MANIFEST_HASH:0:7}, content=${CONTENT_HASH:0:7})"

          # 普通 push (永不 force): push 被拒 = 失败终止
          git push origin release
          echo "✅ release 分支已线性追加"

          # 打发布身份 tag: release/v{N} = 上次序号 + 1 (自动递增)
          LAST_TAG=$(git ls-remote --tags origin "release/v*" | sed 's/.*release\/v//' | sort -n | tail -1)
          if [ -z "$LAST_TAG" ]; then
            NEXT_N=1
          else
            NEXT_N=$((LAST_TAG + 1))
          fi
          RELEASE_TAG="release/v${NEXT_N}"
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT

          # 回写 VERSION 中的 release_tag (release 分支 + build_output 双写)
          sed -i "s/release_tag: (auto)/release_tag: ${RELEASE_TAG}/" VERSION
          git add VERSION
          git commit -m "release: ${SEMVER} (release_tag=${RELEASE_TAG})"
          git push origin release
          echo "✅ ${RELEASE_TAG} 已打 tag"

          # 同步 VERSION + MANIFEST 快照到 build_output (供 publish job 使用)
          cp VERSION MANIFEST.snapshot.yaml /tmp/build_output/
          echo "✅ 元数据已同步到 build_output"

      - name: 上传裁剪产物 (供 publish job)
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: /tmp/build_output/
          retention-days: 1

  # ═══════════════════════════════════════════════════════════
  # Job 2: 发布 — 按 release/v{N} 全量同步到产品仓 (不裁剪)
  # ═══════════════════════════════════════════════════════════
  publish:
    needs: build-and-release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 下载裁剪产物
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: /tmp/build_output

      - name: 推送到产品仓 production (按 release/v{N} 寻址, 不裁剪)
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_REPO_PAT }}
        run: |
          set -euo pipefail
          COMMIT="${{ github.event.inputs.commit }}"
          SEMVER="${{ github.event.inputs.semver }}"
          TAG="${{ github.event.inputs.tag }}"
          COMMIT_SHORT=$(echo "$COMMIT" | cut -c1-7)
          RELEASE_DATE=$(date +%Y%m%d%H%M)
          RELEASE_TAG="${{ needs.build-and-release.outputs.release_tag }}"

          # 配置 git 身份
          git config --global user.name "CI Bot"
          git config --global user.email "ci@algo-source.bot"

          # clone 产品仓
          DEPLOY_REPO="https://github.com/Xubenbenn/algo-deploy.git"
          AUTH_URL=$(echo "$DEPLOY_REPO" | sed "s|https://|https://${DEPLOY_TOKEN}@|")
          SANDBOX=$(mktemp -d)
          git clone --branch master "$AUTH_URL" "$SANDBOX" 2>&1
          cd "$SANDBOX"

          # 切换到 production (线性追加)
          git fetch origin production 2>/dev/null || true
          if git rev-parse origin/production >/dev/null 2>&1; then
            git checkout production
            git reset --hard origin/production
          else
            git checkout --orphan production
          fi

          # 全量同步裁剪产物 (来自 release 分支构建, 此处不裁剪)
          git rm -rf --cached . 2>/dev/null || true
          find . -mindepth 1 -not -path './.git' -not -path './.git/*' -delete 2>/dev/null || true
          cp -r /tmp/build_output/model .
          find model/ -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          # VERSION + MANIFEST 快照来自 release 分支生成的完整元数据
          cp /tmp/build_output/VERSION .
          cp /tmp/build_output/MANIFEST.snapshot.yaml .

          git add model/ VERSION MANIFEST.snapshot.yaml
          if git diff --cached --quiet; then
            echo "ℹ️  无变更 (该 commit 已存在于此 production 历史中), 跳过"
          else
            git commit -m "production: ${TAG} (source=${COMMIT_SHORT}, release=${RELEASE_TAG})"
            git pull --rebase origin production 2>/dev/null || true
            git push --force-with-lease origin production
            echo "✅ production 分支已推送"

            # 对外语义版本 tag
            git tag "$SEMVER" 2>/dev/null || git tag "${SEMVER}-${RELEASE_DATE}"
            git push origin "$SEMVER" 2>/dev/null || true
            echo "✅ tag: ${SEMVER}"
          fi

          # 创建同步分支 (人工 PR 合入 master, 三文件打包)
          echo ""
          echo "━━━ 创建 master 同步分支 ━━━"
          SYNC_BRANCH="sync/model-${COMMIT_SHORT}"
          git checkout master
          git pull origin master 2>/dev/null || true
          git checkout -b "$SYNC_BRANCH"
          git checkout "$(git rev-parse production)" -- model/ VERSION MANIFEST.snapshot.yaml
          if git diff --quiet && git diff --cached --quiet; then
            echo "  ℹ️  master 的 model/ 已是最新, 跳过"
          else
            git commit -m "sync: model/ ← production (source=${COMMIT_SHORT}, release=${RELEASE_TAG})"
            git push origin "$SYNC_BRANCH" 2>&1
            echo "  ✅ 同步分支: ${SYNC_BRANCH}"
            echo "  📋 PR: https://github.com/Xubenbenn/algo-deploy/pull/new/${SYNC_BRANCH}"
          fi

          rm -rf "$SANDBOX"
          echo "✅ 发布完成"
